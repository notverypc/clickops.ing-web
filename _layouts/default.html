<!DOCTYPE html>
{% assign page_title = page.title | default: site.title %}
{% assign page_description = page.excerpt | default: site.description | strip_html | normalize_whitespace %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title | escape }}</title>
  <meta name="description" content="{{ page_description | escape }}" />
  <meta property="og:title" content="{{ page_title | escape }}" />
  <meta property="og:description" content="{{ page_description | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
  <meta property="og:site_name" content="{{ site.title | escape }}" />
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  <script>
    // Runs before first paint so dark mode doesn't flash light.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) {}
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if ((stored || (prefersDark ? "dark" : "light")) === "dark") {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/#latest-posts' | relative_url }}">Posts</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">Dark mode</button>
    </div>
  </header>

  <main>
{{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>{{ site.title }}</p>
    </div>
  </footer>

  <script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
