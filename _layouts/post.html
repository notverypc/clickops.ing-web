---
layout: default
---
<div class="container post-page">
  <article class="post-detail">
    <header class="post-header">
      {% if page.category %}<span class="post-category">{{ page.category }}</span>{% endif %}
      <h1>{{ page.title | escape }}</h1>
      <p class="post-meta">{% if page.author %}By {{ page.author }} · {% endif %}{{ page.date | date: "%-d %B %Y" }}</p>
      {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
    </header>
    <section class="post-content">
{{ content }}
    </section>
    <div class="post-actions">
      <a class="button button-secondary" href="{{ '/' | relative_url }}">Back to posts</a>
    </div>
  </article>
</div>
